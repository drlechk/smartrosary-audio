name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Pages setup
        id: pages-setup
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
          HAS_PAGES_TOKEN: ${{ secrets.PAGES_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          status="$(
            curl -sS -o /tmp/pages.json -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/pages"
          )"

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ "$HAS_PAGES_TOKEN" = "true" ]; then
            exit 0
          fi

          echo "::error::GitHub Pages is not enabled for ${REPO}. Enable Pages in Settings > Pages with source 'GitHub Actions', or add a PAGES_TOKEN secret with Pages write permission so this workflow can enable it automatically."
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ steps.pages-setup.outputs.enabled != 'true' && secrets.PAGES_TOKEN != '' }}

      - name: Build public audio preview
        run: node scripts/build-pages-data.mjs --site-dir=_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
