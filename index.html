<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Smart Rosary</title>
  <meta name="description" content="Podgląd audio Smart Rosary z obsługiwanymi językami, głosami i plikami MP3.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg: linear-gradient(180deg, #0f5aa0 0%, #0b4f8f 55%, #09457e 100%);
      --text: #14223d;
      --muted: #5b6b86;
      --card: #ffffffcc;
      --surface: #ffffff;
      --border: #b7d6f5;
      --accent: #0974cc;
      --accent-dark: #075b9f;
      --accent-contrast: #ffffff;
      --soft: #f3f8fd;
      --warning: #7c2d12;
      --warning-bg: #fff7ed;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
    }

    .home-link {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .home-link img { width: 28px; height: 28px; }

    .selector-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    label {
      color: #fff;
      font-size: 0.9rem;
    }

    select {
      padding: 0.4rem 0.6rem;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-size: 0.95rem;
    }
    select:focus { outline: 2px solid rgba(255,255,255,0.85); outline-offset: 2px; }
    select option { color: #111; }

    main {
      display: grid;
      place-items: start center;
      padding: 1rem 1.25rem 3rem;
      flex: 1;
    }

    .card {
      width: 100%;
      max-width: 1120px;
      background: var(--card);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px #00000014;
    }

    .hero {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .hero-icon {
      width: 78px;
      height: 78px;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.1rem);
      line-height: 1;
      margin: 0 0 0.65rem;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .tools {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(180px, 240px) minmax(0, 1fr) minmax(140px, auto);
      gap: 0.85rem;
      align-items: end;
      margin: 1.5rem 0;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 2px 8px #0000000a;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 0;
    }
    .field label {
      color: var(--muted);
      font-weight: 700;
    }
    .field select,
    .search {
      width: 100%;
      max-width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .search {
      min-height: 38px;
      border-radius: 8px;
      padding: 0.45rem 0.65rem;
      font: inherit;
    }
    .search:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

    .toggle-btn {
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-contrast);
      font: inherit;
      font-weight: 700;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.06s ease;
    }
    .toggle-btn:hover {
      background: var(--accent-dark);
      box-shadow: 0 4px 14px #00000014;
      transform: translateY(-1px);
    }
    .toggle-btn.secondary {
      min-height: 32px;
      background: var(--surface);
      color: var(--accent);
      padding: 0.35rem 0.65rem;
      font-size: 0.84rem;
      white-space: nowrap;
    }
    .toggle-btn.secondary:hover {
      background: var(--soft);
      color: var(--accent-dark);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
      margin: 0 0 1rem;
    }
    .stat {
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem;
    }
    .stat strong {
      display: block;
      font-size: 1.3rem;
      line-height: 1.1;
    }
    .stat span {
      display: block;
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .version-pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1;
      padding: 0.22rem 0.45rem;
      white-space: nowrap;
      vertical-align: middle;
    }

    .clip-list {
      display: grid;
      gap: 0.75rem;
    }
    .clip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 360px);
      gap: 1rem;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 8px #0000000a;
    }
    .clip-main {
      min-width: 0;
    }
    .clip-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      min-width: 0;
    }
    .clip-title {
      display: flex;
      gap: 0.6rem;
      align-items: baseline;
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.35;
      min-width: 0;
    }
    .clip-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      color: var(--accent);
      font-weight: 800;
      white-space: nowrap;
    }
    .clip-group {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .clip-text {
      margin: 0.55rem 0 0;
      color: var(--muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .clip-text.expanded {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
    }
    .clip-text.hidden {
      display: none;
    }
    .clip audio {
      width: 100%;
      min-width: 0;
    }
    .clip-meta {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: right;
    }

    .empty,
    .error {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
    }
    .error {
      background: var(--warning-bg);
      color: var(--warning);
      display: none;
    }
    .error.show { display: block; }

    footer {
      padding: 1rem 1.25rem;
      text-align: center;
      color: rgba(255,255,255,0.88);
      font-size: 0.9rem;
    }
    footer a {
      color: inherit;
      margin-left: 0.75rem;
      text-underline-offset: 0.2em;
    }
    footer a:hover { color: #fff; }
    .deploy-info {
      margin-top: 0.35rem;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      opacity: 0.78;
    }

    @media (max-width: 800px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        padding: 0.75rem 0.9rem;
      }
      .selector-row { justify-content: flex-start; }
      main { padding: 1rem 0.85rem 2rem; }
      .card {
        padding: 1rem;
        border-radius: 12px;
      }
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        justify-items: center;
      }
      .hero-icon {
        width: 54px;
        height: 54px;
      }
      .tools {
        grid-template-columns: 1fr;
        padding: 0.85rem;
      }
      .summary { grid-template-columns: 1fr; }
      .clip {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      .clip-title {
        flex-direction: column;
        gap: 0.2rem;
      }
      .clip-heading {
        flex-direction: column;
      }
      .clip-meta { text-align: left; }
      footer a {
        display: block;
        margin: 0.35rem 0 0;
      }
      .deploy-info {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="home-link" href="https://drlechk.github.io/smartrosary/" target="_blank" rel="noopener">
      <img src="favicon.svg" alt="" role="presentation">
      <span>Smart Rosary</span>
    </a>
    <div class="selector-row">
      <label for="language" data-i18n="labelLanguage">Język:</label>
      <select id="language" aria-label="Język"></select>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="hero">
        <img class="hero-icon" src="favicon.svg" alt="" role="presentation">
        <div>
          <h1 data-i18n="headline">Audio Smart Rosary</h1>
          <p class="lead" data-i18n="lead">Odsłuchaj wygenerowane modlitwy i tajemnice MP3 dla każdego obsługiwanego języka.</p>
        </div>
      </div>

      <div class="tools">
        <div class="field">
          <label for="languageControl" data-i18n="controlLanguage">Język</label>
          <select id="languageControl"></select>
        </div>
        <div class="field">
          <label for="voiceControl" data-i18n="controlVoice">Głos</label>
          <select id="voiceControl"></select>
        </div>
        <div class="field">
          <label for="search" data-i18n="filterAudio">Filtruj pliki audio</label>
          <input class="search" id="search" type="search" placeholder="Szukaj po pliku, tytule lub tekście" data-i18n-placeholder="searchPlaceholder">
        </div>
        <div class="field">
          <label for="textControl" data-i18n="textLabel">Tekst</label>
          <button class="toggle-btn" id="textControl" type="button">Ukryj cały tekst</button>
        </div>
      </div>

      <div class="summary" id="summary" aria-live="polite"></div>
      <div class="error" id="error" role="status"></div>
      <div class="clip-list" id="clipList"></div>
    </section>
  </main>

  <footer>
    <span>© 2026 SmartRosary</span>
    <a href="https://github.com/drlechk/smartrosary-audio" target="_blank" rel="noopener">GitHub</a>
    <div id="deployInfo" class="deploy-info" aria-label="Ostatnie wdrożenie"></div>
  </footer>

  <script>
    (function () {
      const DEFAULT_LANGUAGE = 'pl';
      const strings = {
        en: {
          title: 'Smart Rosary Audio',
          description: 'Smart Rosary audio preview page with supported language and voice MP3 files.',
          headline: 'Smart Rosary Audio',
          lead: 'Preview every generated prayer and mystery MP3 for each supported language.',
          labelLanguage: 'Language:',
          controlLanguage: 'Language',
          controlVoice: 'Voice',
          filterAudio: 'Filter audio files',
          searchPlaceholder: 'Search by file, title, or text',
          textLabel: 'Text',
          hideAllText: 'Hide all text',
          showAllText: 'Show all text',
          hideText: 'Hide text',
          showText: 'Show text',
          selectedLanguage: 'Selected language',
          audioVoiceVersion: 'Audio voice version',
          shown: 'shown',
          unknown: 'unknown',
          noMatches: 'No audio files match the current filter.',
          loadFailed: 'Failed to load audio-data.json',
          noLanguages: 'audio-data.json has no language entries',
          deployLabel: 'Last deploy'
        },
        pl: {
          title: 'Audio Smart Rosary',
          description: 'Podgląd audio Smart Rosary z obsługiwanymi językami, głosami i plikami MP3.',
          headline: 'Audio Smart Rosary',
          lead: 'Odsłuchaj wygenerowane modlitwy i tajemnice MP3 dla każdego obsługiwanego języka.',
          labelLanguage: 'Język:',
          controlLanguage: 'Język',
          controlVoice: 'Głos',
          filterAudio: 'Filtruj pliki audio',
          searchPlaceholder: 'Szukaj po pliku, tytule lub tekście',
          textLabel: 'Tekst',
          hideAllText: 'Ukryj cały tekst',
          showAllText: 'Pokaż cały tekst',
          hideText: 'Ukryj tekst',
          showText: 'Pokaż tekst',
          selectedLanguage: 'Wybrany język',
          audioVoiceVersion: 'Wersja głosu audio',
          shown: 'pokazano',
          unknown: 'nieznana',
          noMatches: 'Żaden plik audio nie pasuje do bieżącego filtra.',
          loadFailed: 'Nie udało się wczytać audio-data.json',
          noLanguages: 'audio-data.json nie zawiera języków',
          deployLabel: 'Ostatnie wdrożenie'
        },
        de: {
          title: 'Smart Rosary Audio',
          description: 'Smart-Rosary-Audiovorschau mit unterstützten Sprachen, Stimmen und MP3-Dateien.',
          headline: 'Smart Rosary Audio',
          lead: 'Hören Sie alle erzeugten Gebete und Geheimnisse als MP3 für jede unterstützte Sprache an.',
          labelLanguage: 'Sprache:',
          controlLanguage: 'Sprache',
          controlVoice: 'Stimme',
          filterAudio: 'Audiodateien filtern',
          searchPlaceholder: 'Nach Datei, Titel oder Text suchen',
          textLabel: 'Text',
          hideAllText: 'Gesamten Text ausblenden',
          showAllText: 'Gesamten Text anzeigen',
          hideText: 'Text ausblenden',
          showText: 'Text anzeigen',
          selectedLanguage: 'Ausgewählte Sprache',
          audioVoiceVersion: 'Audiostimmen-Version',
          shown: 'angezeigt',
          unknown: 'unbekannt',
          noMatches: 'Keine Audiodateien entsprechen dem aktuellen Filter.',
          loadFailed: 'audio-data.json konnte nicht geladen werden',
          noLanguages: 'audio-data.json enthält keine Spracheinträge',
          deployLabel: 'Letztes Deployment'
        },
        fr: {
          title: 'Audio Smart Rosary',
          description: 'Aperçu audio Smart Rosary avec langues, voix et fichiers MP3 pris en charge.',
          headline: 'Audio Smart Rosary',
          lead: 'Écoutez chaque prière et mystère MP3 généré pour chaque langue prise en charge.',
          labelLanguage: 'Langue :',
          controlLanguage: 'Langue',
          controlVoice: 'Voix',
          filterAudio: 'Filtrer les fichiers audio',
          searchPlaceholder: 'Rechercher par fichier, titre ou texte',
          textLabel: 'Texte',
          hideAllText: 'Masquer tout le texte',
          showAllText: 'Afficher tout le texte',
          hideText: 'Masquer le texte',
          showText: 'Afficher le texte',
          selectedLanguage: 'Langue sélectionnée',
          audioVoiceVersion: 'Version de la voix audio',
          shown: 'affichés',
          unknown: 'inconnue',
          noMatches: 'Aucun fichier audio ne correspond au filtre actuel.',
          loadFailed: 'Impossible de charger audio-data.json',
          noLanguages: 'audio-data.json ne contient aucune langue',
          deployLabel: 'Dernier déploiement'
        },
        es: {
          title: 'Audio Smart Rosary',
          description: 'Vista previa de audio de Smart Rosary con idiomas, voces y archivos MP3 compatibles.',
          headline: 'Audio Smart Rosary',
          lead: 'Escucha cada oración y misterio MP3 generado para cada idioma compatible.',
          labelLanguage: 'Idioma:',
          controlLanguage: 'Idioma',
          controlVoice: 'Voz',
          filterAudio: 'Filtrar archivos de audio',
          searchPlaceholder: 'Buscar por archivo, título o texto',
          textLabel: 'Texto',
          hideAllText: 'Ocultar todo el texto',
          showAllText: 'Mostrar todo el texto',
          hideText: 'Ocultar texto',
          showText: 'Mostrar texto',
          selectedLanguage: 'Idioma seleccionado',
          audioVoiceVersion: 'Versión de la voz de audio',
          shown: 'mostrados',
          unknown: 'desconocida',
          noMatches: 'Ningún archivo de audio coincide con el filtro actual.',
          loadFailed: 'No se pudo cargar audio-data.json',
          noLanguages: 'audio-data.json no contiene idiomas',
          deployLabel: 'Último despliegue'
        },
        pt: {
          title: 'Áudio Smart Rosary',
          description: 'Pré-visualização de áudio do Smart Rosary com idiomas, vozes e ficheiros MP3 suportados.',
          headline: 'Áudio Smart Rosary',
          lead: 'Ouça cada oração e mistério MP3 gerado para cada idioma suportado.',
          labelLanguage: 'Idioma:',
          controlLanguage: 'Idioma',
          controlVoice: 'Voz',
          filterAudio: 'Filtrar ficheiros de áudio',
          searchPlaceholder: 'Procurar por ficheiro, título ou texto',
          textLabel: 'Texto',
          hideAllText: 'Ocultar todo o texto',
          showAllText: 'Mostrar todo o texto',
          hideText: 'Ocultar texto',
          showText: 'Mostrar texto',
          selectedLanguage: 'Idioma selecionado',
          audioVoiceVersion: 'Versão da voz de áudio',
          shown: 'mostrados',
          unknown: 'desconhecida',
          noMatches: 'Nenhum ficheiro de áudio corresponde ao filtro atual.',
          loadFailed: 'Não foi possível carregar audio-data.json',
          noLanguages: 'audio-data.json não contém idiomas',
          deployLabel: 'Última publicação'
        }
      };

      const state = {
        data: null,
        language: new URLSearchParams(location.search).get('lang') || localStorage.getItem('smartrosaryAudioLanguage') || DEFAULT_LANGUAGE,
        voice: new URLSearchParams(location.search).get('voice') || localStorage.getItem('smartrosaryAudioVoice') || '',
        query: '',
        showAllText: localStorage.getItem('smartrosaryAudioShowText') !== 'false',
        textOverrides: new Map()
      };

      const els = {
        language: document.getElementById('language'),
        languageControl: document.getElementById('languageControl'),
        voiceControl: document.getElementById('voiceControl'),
        search: document.getElementById('search'),
        textControl: document.getElementById('textControl'),
        summary: document.getElementById('summary'),
        error: document.getElementById('error'),
        clipList: document.getElementById('clipList'),
        deployInfo: document.getElementById('deployInfo')
      };

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function formatBytes(bytes) {
        if (!bytes) return '0 KB';
        const units = ['B', 'KB', 'MB'];
        let value = bytes;
        let unitIndex = 0;
        while (value >= 1024 && unitIndex < units.length - 1) {
          value /= 1024;
          unitIndex += 1;
        }
        return `${value.toFixed(unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
      }

      function formatDuration(seconds) {
        if (!Number.isFinite(seconds)) return '';
        const rounded = Math.round(seconds);
        const minutes = Math.floor(rounded / 60);
        const rest = String(rounded % 60).padStart(2, '0');
        return `${minutes}:${rest}`;
      }

      function getLanguage() {
        return state.data.languages.find((language) => language.code === state.language) || state.data.languages[0];
      }

      function getVariant(language) {
        return language.variants.find((variant) => variant.id === state.voice) || language.variants[0];
      }

      function getStrings(languageCode = state.language) {
        return strings[languageCode] || strings.en;
      }

      function applyPageText(language) {
        const dict = getStrings(language.code);
        document.title = dict.title;
        const description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute('content', dict.description);
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          const key = el.getAttribute('data-i18n');
          if (dict[key]) el.textContent = dict[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (dict[key]) el.setAttribute('placeholder', dict[key]);
        });
        els.language.setAttribute('aria-label', dict.controlLanguage);
        setDeployInfo(dict);
      }

      function setDeployInfo(dict) {
        const ts = new Date(document.lastModified);
        const formatted = Number.isNaN(ts.getTime())
          ? ''
          : ts.toLocaleString(undefined, {
              year: 'numeric',
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            });
        els.deployInfo.setAttribute('aria-label', dict.deployLabel);
        els.deployInfo.textContent = formatted ? `${dict.deployLabel}: ${formatted}` : '';
      }

      function getTextKey(clip) {
        return clip.file;
      }

      function isClipTextVisible(clip) {
        const key = getTextKey(clip);
        return state.textOverrides.has(key) ? state.textOverrides.get(key) : state.showAllText;
      }

      function updateTextControl() {
        const dict = getStrings();
        els.textControl.textContent = state.showAllText ? dict.hideAllText : dict.showAllText;
        els.textControl.setAttribute('aria-pressed', String(state.showAllText));
      }

      function updateUrl() {
        const params = new URLSearchParams();
        params.set('lang', state.language);
        if (state.voice) params.set('voice', state.voice);
        history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
      }

      function syncSelectOptions() {
        const languageOptions = state.data.languages.map((language) =>
          `<option value="${escapeHtml(language.code)}">${escapeHtml(language.name)}</option>`
        ).join('');
        els.language.innerHTML = languageOptions;
        els.languageControl.innerHTML = languageOptions;
        els.language.value = state.language;
        els.languageControl.value = state.language;

        const language = getLanguage();
        const variant = getVariant(language);
        state.language = language.code;
        state.voice = variant.id;
        els.voiceControl.innerHTML = language.variants.map((item) =>
          `<option value="${escapeHtml(item.id)}">${escapeHtml(item.voice)} · v${escapeHtml(item.version || getStrings(language.code).unknown)}</option>`
        ).join('');
        els.voiceControl.value = state.voice;
      }

      function renderSummary(language, variant, clips) {
        const dict = getStrings(language.code);
        const bytes = variant.clips.reduce((sum, clip) => sum + clip.bytes, 0);
        els.summary.innerHTML = `
          <div class="stat"><strong>${escapeHtml(language.name)}</strong><span>${escapeHtml(dict.selectedLanguage)}</span></div>
          <div class="stat"><strong>${escapeHtml(variant.voice)}</strong><span>${escapeHtml(variant.id)}</span></div>
          <div class="stat"><strong><span class="version-pill">v${escapeHtml(variant.version || dict.unknown)}</span></strong><span>${escapeHtml(dict.audioVoiceVersion)}</span></div>
          <div class="stat"><strong>${variant.clipCount}</strong><span>${clips.length} ${escapeHtml(dict.shown)} · ${formatBytes(bytes)}</span></div>
        `;
      }

      function renderClips() {
        const language = getLanguage();
        const variant = getVariant(language);
        const dict = getStrings(language.code);
        const query = state.query.trim().toLowerCase();
        const clips = query
          ? variant.clips.filter((clip) =>
              [clip.id, clip.file, clip.title, clip.group, clip.text].join(' ').toLowerCase().includes(query)
            )
          : variant.clips;

        document.documentElement.lang = language.code;
        applyPageText(language);
        syncSelectOptions();
        renderSummary(language, variant, clips);
        updateTextControl();
        updateUrl();
        localStorage.setItem('smartrosaryAudioLanguage', state.language);
        localStorage.setItem('smartrosaryAudioVoice', state.voice);
        localStorage.setItem('smartrosaryAudioShowText', String(state.showAllText));

        if (!clips.length) {
          els.clipList.innerHTML = `<div class="empty">${escapeHtml(dict.noMatches)}</div>`;
          return;
        }

        els.clipList.innerHTML = clips.map((clip) => {
          const hasText = Boolean(clip.text);
          const textVisible = hasText && isClipTextVisible(clip);
          return `
          <article class="clip">
            <div class="clip-main">
              <div class="clip-heading">
                <h2 class="clip-title"><span class="clip-id">${escapeHtml(clip.id)}.mp3</span><span>${escapeHtml(clip.title)}</span></h2>
                ${hasText ? `<button class="toggle-btn secondary" type="button" data-toggle-text="${escapeHtml(getTextKey(clip))}" aria-expanded="${textVisible}">${textVisible ? escapeHtml(dict.hideText) : escapeHtml(dict.showText)}</button>` : ''}
              </div>
              <p class="clip-group">${escapeHtml(clip.group)}</p>
              ${hasText ? `<p class="clip-text expanded${textVisible ? '' : ' hidden'}">${escapeHtml(clip.text)}</p>` : ''}
            </div>
            <div>
              <audio controls preload="metadata" src="${encodeURI(clip.file)}" data-bytes="${clip.bytes}"></audio>
              <p class="clip-meta">${formatBytes(clip.bytes)}</p>
            </div>
          </article>
        `;
        }).join('');

        els.clipList.querySelectorAll('audio').forEach((audio) => {
          audio.addEventListener('loadedmetadata', () => {
            const meta = audio.nextElementSibling;
            const duration = formatDuration(audio.duration);
            if (duration) meta.textContent = `${duration} · ${formatBytes(Number(audio.dataset.bytes))}`;
          }, { once: true });
        });
      }

      function setLanguage(value) {
        state.language = value;
        const language = getLanguage();
        state.voice = getVariant(language).id;
        renderClips();
      }

      function bindEvents() {
        els.language.addEventListener('change', (event) => setLanguage(event.target.value));
        els.languageControl.addEventListener('change', (event) => setLanguage(event.target.value));
        els.voiceControl.addEventListener('change', (event) => {
          state.voice = event.target.value;
          renderClips();
        });
        els.search.addEventListener('input', (event) => {
          state.query = event.target.value;
          renderClips();
        });
        els.textControl.addEventListener('click', () => {
          state.showAllText = !state.showAllText;
          state.textOverrides.clear();
          renderClips();
        });
        els.clipList.addEventListener('click', (event) => {
          const button = event.target.closest('[data-toggle-text]');
          if (!button) return;
          const key = button.getAttribute('data-toggle-text');
          const language = getLanguage();
          const variant = getVariant(language);
          const clip = variant.clips.find((item) => getTextKey(item) === key);
          if (!clip) return;
          state.textOverrides.set(key, !isClipTextVisible(clip));
          renderClips();
        });
      }

      async function init() {
        try {
          applyPageText({ code: state.language });
          const response = await fetch('audio-data.json', { cache: 'no-store' });
          if (!response.ok) throw new Error(`${getStrings().loadFailed} (${response.status})`);
          state.data = await response.json();
          if (!state.data.languages || !state.data.languages.length) {
            throw new Error(getStrings().noLanguages);
          }
          if (!state.data.languages.some((language) => language.code === state.language)) {
            state.language = DEFAULT_LANGUAGE;
          }
          bindEvents();
          renderClips();
        } catch (error) {
          els.error.textContent = error.message;
          els.error.classList.add('show');
        }
      }

      init();
    }());
  </script>
</body>
</html>
